name: Build and Push to ECR

on:
  push:
    branches: [ "main", "dev" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: gen3-frontend

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Each GitHub environment holds the AWS_ROLE of its account; the image is built and pushed to
    # the gen3-frontend ECR repository of every environment that follows this branch.
    strategy:
      matrix:
        env: ${{ fromJSON(github.ref == 'refs/heads/main' && '["prod"]' || '["dev", "acc"]') }}
    environment: ${{ matrix.env }}
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug GitHub Context
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Actor: ${{ github.actor }}"
        echo "Event: ${{ github.event_name }}"
        echo "Environment: ${{ matrix.env }}"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}
        audience: sts.amazonaws.com

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # The Dockerfile.config based docker image allows us to run the landing page with externalized configuration.
        docker build -f Dockerfile.config -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
